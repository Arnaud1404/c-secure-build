name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record toolchain versions
        run: |
          "$CC" --version | head -1
          make --version | head -1

      - name: Build with hardening flags and sanitizers
        run: make

  scan:
    name: security gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the toolchain image
        run: docker build -t c-secure-build-toolchain .

      - name: Record tool versions
        run: |
          docker run --rm c-secure-build-toolchain sh -c \
            'gcc --version | head -1; valgrind --version; flawfinder --version; semgrep --version'

      - name: Run the gate
        id: gate
        run: |
          # docker's own failures (125-127) read as "could not run".
          code=0
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" \
            c-secure-build-toolchain || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

          # A *-vulnerable tag must block; passing there means detection was lost.
          case "$GITHUB_REF_NAME" in
            *-vulnerable) echo "expected=1" >> "$GITHUB_OUTPUT" ;;
            *)            echo "expected=0" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload Flawfinder SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: .security/flawfinder.sarif
          category: flawfinder

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: .security/semgrep.sarif
          category: semgrep

      - name: Enforce the gate
        if: always()
        env:
          CODE: ${{ steps.gate.outputs.code }}
          EXPECTED: ${{ steps.gate.outputs.expected }}
        run: |
          fail() {
            echo "::error::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # No output at all means the gate step never ran.
          if [ "${CODE:-2}" -gt 1 ]; then
            fail "Gate could not run (exit ${CODE:-2}). Nothing was scanned."
          fi
          if [ "$CODE" != "$EXPECTED" ] && [ "$EXPECTED" = 1 ]; then
            fail "Gate passed at $GITHUB_REF_NAME, a vulnerable fixture it must block. The planted defects are no longer detected."
          fi
          if [ "$CODE" != "$EXPECTED" ]; then
            fail "Gate blocked. SARIF findings are in the Security tab, ASan and Valgrind output in the gate step's log."
          fi

          if [ "$CODE" = 1 ]; then
            echo "Gate blocked $GITHUB_REF_NAME, as this fixture requires." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gate passed." >> "$GITHUB_STEP_SUMMARY"
          fi

  fixtures:
    name: fixture mirrors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # docs/ cites line numbers in the mirror. hardened_shell.c is free to move.
      - name: Assert the vulnerable mirror matches its tag
        run: |
          rc=0
          check() {
            if git show "${1}:src/vuln_shell.c" | diff -u - "$2" > /dev/null; then
              echo "ok: $2 matches $1"
            else
              echo "::error file=$2::$2 has drifted from tag $1"
              rc=1
            fi
          }
          check v2-vulnerable src/vuln_shell.c.bak
          exit "$rc"

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Scan history for secrets
        id: gitleaks
        run: |
          code=0
          gitleaks git . \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Enforce the secret scan
        if: steps.gitleaks.outputs.code != '0'
        run: |
          echo "::error::gitleaks found a secret in the history."
          exit 1

  security-report:
    name: security-data release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the pinned scanners
        run: pip install -r requirements.txt

      - name: Install valgrind and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind zip

      - name: Collect the security dataset
        run: |
          # HEAD is the tag here, so compare against main.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          ./scripts/collect_security_data.sh "${GITHUB_REF_NAME}" origin/main

      - name: Package the dataset
        run: zip -qr "security-data-${GITHUB_REF_NAME}.zip" .security-report

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "security-data-${GITHUB_REF_NAME}.zip" \
            --title "Security data for ${GITHUB_REF_NAME}" \
            --notes "Dataset generated by scripts/collect_security_data.sh: SARIF (flawfinder, semgrep), gate exit codes, Valgrind and ASan logs, findings table, and the shell's patch versus main. Analysis: docs/security-report-${GITHUB_REF_NAME}.md." \
            || gh release upload "$GITHUB_REF_NAME" "security-data-${GITHUB_REF_NAME}.zip" --clobber
